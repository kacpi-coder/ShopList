

<section class="products-gallery">
  <h1>Wszystkie produkty</h1>

  <swiper-container
    slides-per-view="3"
    space-between="20"
    navigation="true"
    pagination="true"
    [breakpoints]="{
      '0': { slidesPerView: 1 },
      '600': { slidesPerView: 2 },
      '900': { slidesPerView: 3 }
    }">

    @for (item of products; track item.id) {
      <swiper-slide>
        <article class="product-card">

          <a
            [routerLink]="['/produkt', item.id]"
            class="product-details-link">

            <img [src]="item.image" [alt]="item.name">
            <h2>{{ item.name }}</h2>
          </a>

          <div class="rating">
            @for (star of [1, 2, 3, 4, 5]; track star) {
              <span>
                {{ star <= item.rating ? '★' : '☆' }}
              </span>
            }

            <span class="rating-count">
              ({{ item.reviewsCount }} opinii)
            </span>
          </div>

          <p class="price">{{ item.price }} zł</p>

          <button
            type="button"
            class="add-to-cart-btn"
            [class.added]="addedProductId === item.id"
            (click)="onAddToCart(item)">

            @if (addedProductId === item.id) {
              <span class="success-icon">✓</span>
              Dodano do koszyka!
            } @else {
              Dodaj do koszyka
            }

          </button>

        </article>
      </swiper-slide>
    }

  </swiper-container>
</section>
