
<section class="products-gallery">

  <h1>Wszystkie produkty</h1>

  <div class="carousel">

    <button
      type="button"
      class="carousel-arrow"
      (click)="prevSlide()"
      [disabled]="currentIndex === 0"
      aria-label="Poprzednie produkty">
      &#10094;
    </button>

    <div class="carousel-window">

      <div
        class="carousel-track"
        [style.transform]="'translateX(-' + currentIndex * (100 / 3) + '%)'">

        @for (item of products; track item.id) {

          <article class="product-card">

            <a
              [routerLink]="['/produkt', item.id]"
              class="product-details-link">

              <img
                [src]="item.image"
                [alt]="item.name">

              <h2>{{ item.name }}</h2>

            </a>

            <div class="rating">
              @for (star of [1, 2, 3, 4, 5]; track star) {
                <span>
                  {{ star <= item.rating ? '★' : '☆' }}
                </span>
              }

              <span class="rating-count">
                ({{ item.reviewsCount }} opinii)
              </span>
            </div>

            <p class="price">{{ item.price }} zł</p>

            <button
              type="button"
              class="add-to-cart-btn"
              [class.added]="addedProductId === item.id"
              (click)="onAddToCart(item)">

              @if (addedProductId === item.id) {
                <span class="success-icon">✓</span>
                Dodano do koszyka!
              } @else {
                Dodaj do koszyka
              }

            </button>

          </article>

        }

      </div>

    </div>

    <button
      type="button"
      class="carousel-arrow"
      (click)="nextSlide()"
      [disabled]="currentIndex >= products.length - 3"
      aria-label="Następne produkty">
      &#10095;
    </button>

  </div>

</section>
