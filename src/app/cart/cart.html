<div class="cart" [class.mini-cart]="mode === 'modal'">

  @if (mode === 'page') {
    <h1>Twój koszyk</h1>
  } @else {
    <h2>Twój koszyk</h2>
  }

  @if (cart.length === 0) {
    <p class="empty">Twój koszyk jest pusty.</p>
  } @else {
    <div class="products">
      @for (product of cart; track $index) {
        <div class="cart-item">
          <span class="product-name">{{ product.name }}</span>

          <div class="quantity">
            <button mat-icon-button (click)="decreaseQuantity($index)">
              <mat-icon>remove</mat-icon>
            </button>

            <span class="quantity-number">{{ product.quantity }}</span>

            <button mat-icon-button (click)="increaseQuantity($index)">
              <mat-icon>add</mat-icon>
            </button>
          </div>

          <span class="product-total">
            {{ product.price * product.quantity }} zł
          </span>

          <button mat-icon-button (click)="removeProduct($index)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      }
    </div>

    <div class="separator"></div>
    <h3 class="total">
      <span>Suma:</span>
      <span>{{ getTotal() }} zł</span>
    </h3>
  }
</div>
